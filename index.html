<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Github</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <img class="profile-avatar" id="avatar" alt=".">
            <h1 class="profile-name" id="name"></h1>
            <h2 class="profile-username" id="username"></h2>
            <ul class="numbers">
                <li class="numbers-item">
                    <h4>Repositórios</h4>
                    <span id="repository"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguidores</h4>
                    <span id="followers"></span>
                </li>
                <li class="numbers-item">
                    <h4>Seguindo</h4>
                    <span id="following"></span>
                </li>
            </ul>
            <div class="readme">
                <img class="readme-img" loading="lazy" height="100%" src="https://camo.githubusercontent.com/3823c2dfc74e5b03ea9494b89c247e8e9be53df6f2c22f2f1fa12e94d467133d/68747470733a2f2f6769746875622d726561646d652d73746174732e76657263656c2e6170702f6170693f757365726e616d653d6a6f616f76626f6e69666163696f267468656d653d746f6b796f6e696768742669636f6e733d74727565">
            </div>

            <a class="profile-link" id="link">Ver no Github</a>
        </div>
    </header>
    <script src="jquery.js"></script>
    <script src="scripts.js"></script>
</body>
</html>
